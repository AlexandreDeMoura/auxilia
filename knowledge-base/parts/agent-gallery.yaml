    side: screen
  - label: One agent's card, and what clicking it does
    at: web/src/app/(protected)/agents/components/agent-card.tsx#AgentCard
    side: screen
  - label: The table view, and what clicking a row does
    at: web/src/app/(protected)/agents/components/agent-table.tsx#AgentTable
    side: screen
