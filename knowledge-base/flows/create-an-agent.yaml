name: Create an agent
area: agents
actor: editor
goal: Have a new agent in the workspace, with instructions, that the Editor owns.
trigger: The Editor clicks New agent on the Agents page.
outcome: The agent exists, owned by the Editor, and its page is open in read mode.
preconditions:
  - flow_to_write: sign-in
    so_that: The Editor is signed in.
steps:
  - id: open
    does: Clicks New agent at the top of the Agents page, or Create an agent when the workspace has no agent yet.
    sees: The new agent page opens. On the left, a 🤖 emoji on a coloured square, the fields Agent name and "Describe what this agent does", and the Instructions tab with an empty text area. On the right, the sections TOOLS, SKILLS and SUBAGENTS, each empty.
    system: The page lets an Editor or an Admin through to the form.
    parts: [workspace-roles, agent-editor]
  - id: fill
    does: Types a name and instructions, and may add a description. May click the emoji to choose another emoji and one of the colours under the picker.
    sees: The header reads "agents / " followed by the name in lower case with dashes, next to an UNSAVED badge. Create agent becomes clickable once both the name and the instructions are filled. Tools, skills and subagents can be added on the right before creating; each has its own Flow. Closing or reloading the tab now makes the browser ask whether to leave.
  - id: create
    does: Clicks Create agent.
    sees: The button reads "Saving…".
    system: The system checks the user is at least an Editor, then stores the agent and everything in the draft in one go, with the user as its owner. If any part of the draft is refused, nothing is stored.
    parts: [workspace-roles, agent-save, agent]
  - id: land
    sees: The agent's page opens in read mode, with the name, the description and the instructions shown as formatted text. The header has Test in chat, Edit and a ⋯ menu offering View thread history and Archive agent.
    system: The system loads the agent and finds that the user is its owner, which allows editing and archiving.
    parts: [agent-access, agent-editor]
qa:
  setup:
    - Sign in as an Editor.
    - Open Agents from the sidebar.
  steps:
    - id: open
      do: Click New agent.
      expect: The new agent page opens with an empty name, an empty Instructions area and a 🤖 emoji. On the right are TOOLS, SKILLS and SUBAGENTS, each empty.
    - id: name-only
      do: Type "QA agent" as the name.
      expect: The header reads "agents / qa-agent" with an UNSAVED badge. Create agent stays greyed out.
    - id: instructions
      do: Type "Answer in one sentence." in Instructions.
      expect: Create agent can now be clicked.
    - id: look
      do: Click the emoji, pick another emoji and another colour.
      expect: The square shows the new emoji on the new colour.
    - id: create
      do: Click Create agent.
      expect: The page becomes the agent's page in read mode, showing "QA agent" and "Answer in one sentence." The header has Test in chat, Edit and a ⋯ menu with View thread history and Archive agent.
    - id: gallery
      do: Open Agents from the sidebar.
      expect: QA agent is in the list.
variants:
  - id: member-refused
    name: A Member clicks New agent
    diverges_at: open
    when: The user clicking New agent has the Member role.
    outcome: No form opens and no agent is created.
    steps:
      - id: refused
        does: Clicks New agent.
        sees: A dialog titled "Insufficient privileges" says "You need at least editor permissions to create agents.", with a Close button. The Agents page stays behind it.
        system: The page sees the user is a Member and does not open the form.
        parts: [workspace-roles]
    qa:
      setup:
        - Sign in as a Member.
        - Open Agents from the sidebar.
      steps:
        - id: refused
          do: Click New agent.
          expect: The "Insufficient privileges" dialog says "You need at least editor permissions to create agents." The address does not change.
        - id: close
          do: Click Close.
          expect: The dialog closes on the Agents page.
  - id: member-by-address
    name: A Member opens the new agent page by its address
    diverges_at: open
    when: A Member types the new agent page's address in the browser instead of clicking New agent.
    outcome: The Member filled the form, but no agent is created.
    steps:
      - id: open-by-address
        does: Goes to /agents/new by typing the address.
        sees: The blank new agent page opens, as for an Editor.
        parts: [agent-editor]
      - id: fill
        does: Types a name and instructions.
        sees: Create agent becomes clickable.
      - id: refused
        does: Clicks Create agent.
        sees: A red banner under the header says "editor access required". The draft stays as it was.
        system: The system refuses to create an agent for a user below Editor and stores nothing.
        parts: [workspace-roles, agent-save]
    qa:
      setup:
        - Sign in as a Member.
      steps:
        - id: open-by-address
          do: Type the app's address followed by /agents/new in the browser and press Enter.
          expect: The new agent page opens with an empty form.
        - id: fill
          do: Type "QA agent" as the name and "Answer in one sentence." in Instructions.
          expect: Create agent can be clicked.
        - id: refused
          do: Click Create agent.
          expect: A red banner says "editor access required" and the form keeps what was typed.
        - id: gallery
          do: Open Agents from the sidebar and leave the page when the browser asks.
          expect: No agent called QA agent is in the list.
  - id: cancel
    name: The Editor cancels
    diverges_at: create
    when: The Editor clicks Cancel instead of Create agent.
    outcome: No agent is created and the Editor is back on the Agents page.
    steps:
      - id: cancel
        does: Clicks Cancel, then confirms "Discard unsaved changes?" when anything was typed.
        sees: The Agents page, without the draft.
        parts: [agent-editor]
    qa:
      setup:
        - Sign in as an Editor.
        - Open Agents from the sidebar and click New agent.
        - Type "QA cancel" as the name.
      steps:
        - id: cancel
          do: Click Cancel.
          expect: The browser asks "Discard unsaved changes?".
        - id: confirm
          do: Confirm.
          expect: The Agents page opens and has no agent called QA cancel.
  - id: save-fails
    name: The save fails
    diverges_at: create
    when: The system cannot store the agent, because it refuses part of the draft or cannot be reached.
    outcome: No agent is created and the draft stays on screen to be fixed or retried.
    steps:
      - id: refused
        does: Clicks Create agent.
        sees: A red banner under the header gives the system's reason, or "Failed to save the agent." when there is none. The draft and its UNSAVED badge stay.
        system: The system stores nothing of the draft.
        parts: [agent-save]
    qa:
      setup:
        - Sign in as an Editor.
        - Open Agents from the sidebar and click New agent.
        - Type "QA agent" as the name and "Answer in one sentence." in Instructions.
        - Stop the backend, leaving the web app running.
      steps:
        - id: refused
          do: Click Create agent.
          expect: A red banner says "Failed to save the agent." and the form keeps what was typed.
        - id: retry
          do: Start the backend again and click Create agent.
          expect: The agent's page opens in read mode.
