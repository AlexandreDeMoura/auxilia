name: Find an agent
area: agents
actor: member
goal: Find an agent they can use among the workspace's agents and open it.
trigger: The Member opens Agents from the sidebar.
outcome: The agent's page is open in read mode.
preconditions:
  - flow_to_write: sign-in
    so_that: The Member is signed in.
  - flow: create-an-agent
    so_that: The workspace has agents.
  - flow_to_write: share-an-agent
    so_that: The Member has access to at least one agent.
steps:
  - id: open-gallery
    does: Opens Agents from the sidebar.
    sees: The Agents page opens on the "Available to you" tab, listing only the agents the Member can use, as a table with the columns Agent, MCP servers, Subagents, Owner and Access. Rows are grouped under each tag's name, untagged agents last under Others; when no agent has a tag there are no group headings. Access reads MEMBER, EDITOR, ADMIN or OWNER.
    system: The system lists the workspace's agents with what this user may do with each.
    parts: [agent-gallery, agent-access]
  - id: search
    does: Types part of a name in "Search agents…".
    sees: Only the agents whose name contains the text stay listed, whatever the case of the letters. When none does, "No agents found" appears with a Clear search button that empties the box.
    parts: [agent-gallery]
  - id: cards
    does: Clicks Card view, the grid icon next to the tabs.
    sees: The agents become cards in one section per tag, then Others. Each card shows the emoji, the name, "by" and the owner's name, an access badge, the description or "No description provided.", the icons of its MCP servers and up to four subagents. A section with more than seven agents shows seven and a "See all" card with "+N more". The Agents page opens in the same view next time.
    parts: [agent-gallery]
  - id: open-agent
    does: Clicks an agent.
    sees: The agent's page opens in read mode with its name, description and instructions. Edit appears only when the Member may edit the agent.
    system: The system loads the agent with the Member's access to it.
    parts: [agent-gallery, agent-access, agent-editor]
qa:
  setup:
    - As an Editor, create two agents, "QA shared" and "QA private", following Create an agent.
    - Give a Member user Member access to QA shared only, following Share an agent.
    - Sign in as that Member.
  steps:
    - id: open-gallery
      do: Open Agents from the sidebar.
      expect: The "Available to you" tab is selected. QA shared is listed with MEMBER under Access; QA private is not listed.
    - id: search
      do: Type "qa sh" in "Search agents…".
      expect: Only QA shared stays listed.
    - id: no-match
      do: Replace the search with "zzzz".
      expect: '"No agents found" appears with a Clear search button.'
    - id: clear
      do: Click Clear search.
      expect: The search box is empty and QA shared is listed again.
    - id: cards
      do: Click Card view next to the tabs.
      expect: QA shared appears as a card with a Member badge and "by" followed by the Editor's name.
    - id: remembered
      do: Reload the page.
      expect: The agents are still shown as cards.
    - id: open-agent
      do: Click QA shared.
      expect: Its page opens in read mode with its instructions, and there is no Edit button.
variants:
  - id: no-access
    name: The Member clicks an agent they have no access to
    diverges_at: open-agent
    when: The Member switches to the All tab and clicks an agent marked No access.
    outcome: The agent's page does not open; the Member is told who can grant access.
    steps:
      - id: all-tab
        does: Clicks the All tab.
        sees: Every agent of the workspace is listed, those the Member cannot use marked NO ACCESS.
        parts: [agent-gallery]
      - id: refused
        does: Clicks an agent marked NO ACCESS.
        sees: A dialog titled "No access" says "You don't have permission to view this agent. Ask the agent's owner or a workspace admin to grant you access.", with a Close button.
        parts: [agent-gallery]
    qa:
      setup:
        - Set up QA shared and QA private as on the main path, and sign in as the same Member.
        - Open Agents from the sidebar.
      steps:
        - id: all-tab
          do: Click the All tab.
          expect: QA private is listed with NO ACCESS under Access.
        - id: refused
          do: Click QA private.
          expect: The "No access" dialog appears and the address stays on the Agents page.
  - id: nothing-shared
    name: Nothing is shared with the Member yet
    diverges_at: open-gallery
    when: The workspace has agents but the Member has access to none of them.
    outcome: No agent can be opened; the Member is told to ask for access.
    steps:
      - id: empty
        does: Opens Agents from the sidebar.
        sees: '"Nothing shared with you yet" says "Ask a workspace admin or an agent''s owner to give you access — or switch to All to browse everything in your workspace."'
        system: The system lists the workspace's agents, none of them usable by this user.
        parts: [agent-gallery, agent-access]
    qa:
      setup:
        - As an Editor, create an agent "QA private" following Create an agent, and share it with nobody.
        - Sign in as a Member who has access to no agent.
      steps:
        - id: empty
          do: Open Agents from the sidebar.
          expect: '"Nothing shared with you yet" is shown on the "Available to you" tab.'
        - id: all-tab
          do: Click the All tab.
          expect: QA private is listed with NO ACCESS under Access.
