agents:
  name: Agents
  is: Setting up an agent — its instructions, MCP tools, skills, subagents, sandbox, tag and who can use it — and archiving it.
  flows_to_write:
    edit-an-agent:
      name: Edit an agent
      is: An Editor of an agent switches its page from read mode to edit mode, changes its name, description, look or instructions, and saves the whole configuration at once, or discards the changes.
    give-an-agent-mcp-tools:
      name: Give an agent MCP tools
      is: An Editor adds a workspace MCP server to an agent, sets each of its tools to always allowed, needs approval or disabled, and saves; removing a server works the same way.
    connect-a-server-from-an-agent:
      name: Connect a server from an agent's page
      is: A user viewing an agent whose MCP server they have not connected yet clicks Connect, authorizes it, and the agent's saved tool list is refreshed with the server's current tools.
    give-an-agent-code-execution:
      name: Give an agent code execution
      is: An Editor attaches one of the workspace's sandboxes to an agent so it can run code, or removes it after a warning when enabled skills need it.
    enable-skills-on-an-agent:
      name: Enable skills on an agent
      is: An Editor picks skills from the workspace library for an agent and saves; a skill whose scripts need code execution says so and offers to turn it on.
    add-a-subagent:
      name: Add a subagent
      is: An Editor adds other agents as subagents the agent can hand work to, one level deep only, and saves; the added agents are then marked as subagents.
    share-an-agent:
      name: Share an agent
      is: The agent's owner or an Admin gives people Member, Editor or Admin access to the agent and gives teams Member access, then saves the permissions.
    tag-an-agent:
      name: Tag an agent
      is: An Editor of an agent picks the tag it is listed under in the gallery, which takes effect at once without saving the agent.
    manage-agent-tags:
      name: Manage agent tags
      is: A workspace Admin creates, renames or deletes the tags agents are grouped under; agents carrying a deleted tag become untagged.
    archive-an-agent:
      name: Archive an agent
      is: The agent's owner or an Admin archives it from its page; it leaves the gallery and its threads are shown as archived.
    handle-an-archived-agent:
      name: Handle an archived agent
      is: The agent's owner or an Admin opens an archived agent from the Archived tab and either restores it, making it available again, or deletes it for good along with its tool connections and every thread that used it.
sign-in:
  name: Sign-in
  is: Getting into the workspace — first-admin setup, password or Google sign-in, accepting an invite.
  flows_to_write:
    sign-in:
      name: Sign in
      is: A user with an account signs in with their email and password or with Google, and lands on the Agents page.
